[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentence-machine"
version = "0.1.0"
description = "The Sentence Machine — a cross-platform command interpreter"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
sentence-machine = "sentence_machine.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
